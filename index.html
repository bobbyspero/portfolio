<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bobby spero - portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ascii-overlay"></div>

    <div class="container">
        <header class="header">
            <h1 class="glitch">bobby spero</h1>
        </header>

        <div class="scene">
            <div class="grid-wrapper" id="gridWrapper">
                <!-- Grid items will be generated by JavaScript -->
            </div>
        </div>

        <div class="title-tracker" id="titleTracker"></div>
    </div>

    <!-- Expanded Project View -->
    <div class="project-modal" id="projectModal">
        <div class="project-modal-overlay" id="modalOverlay"></div>
        <div class="project-modal-content">
            <button class="modal-close" id="modalClose">&times;</button>

            <div class="modal-body">
                <div class="modal-gallery">
                    <button class="gallery-nav gallery-prev" id="galleryPrev">&lsaquo;</button>
                    <img class="gallery-image" id="galleryImage" src="" alt="Project image">
                    <button class="gallery-nav gallery-next" id="galleryNext">&rsaquo;</button>
                    <div class="gallery-dots" id="galleryDots"></div>
                </div>

                <div class="modal-info">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <p class="modal-description" id="modalDescription"></p>
                    <a class="modal-link" id="modalLink" href="#" target="_blank" rel="noopener noreferrer">View Project →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
