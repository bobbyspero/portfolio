<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ASCII Portfolio Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ascii-overlay"></div>

    <div class="container">
        <header class="header">
            <h1 class="glitch" data-text="// PORTFOLIO.EXE">>_ PORTFOLIO.EXE</h1>
            <p class="subtitle">[ INTERACTIVE 3D GRID SYSTEM v1.0 ]</p>
        </header>

        <div class="scene">
            <div class="grid-wrapper" id="gridWrapper">
                <!-- Grid items will be generated by JavaScript -->
            </div>
        </div>

        <div class="title-tracker" id="titleTracker"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
